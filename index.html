  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 輕量跳動動畫與聚焦邊框 */
    @keyframes gentle-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .animate-gentle {
      animation: gentle-bounce 2s infinite ease-in-out;
    }

    /* 溫和搖晃（答錯時無挫折感提示） */
    @keyframes gentle-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .shake-gentle {
      animation: gentle-shake 0.4s ease-in-out;
    }

    /* 浮起大按鈕陰影效果 */
    .big-touch-btn {
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .big-touch-btn:active {
      transform: scale(0.96) translateY(4px);
    }
  </style>

          { name: '戴香包插艾草', emoji: '🌿', desc: '掛上香噴噴的香包與艾草，可以驅除蚊蟲保平安。' }

        id: 'moon',

        items: [

          { name: '可愛玉兔與嫦娥', emoji: '🐇', desc: '傳說月亮上有搗藥的小玉兔和美麗的嫦娥仙子。' }

    /* 挑戰題庫 (混洗隨機挑選) */
    const QUIZ_BANK = [
      { text: '吃美味的月餅', emoji: '🥮', festival: 'moon', festivalName: '中秋節' },
      { text: '同心協力划龍舟', emoji: '🛶', festival: 'dragon', festivalName: '端午節' },
      { text: '高興拿紅包', emoji: '🧧', festival: 'cny', festivalName: '春節' },
      { text: '端午節中午立蛋', emoji: '🥚', festival: 'dragon', festivalName: '端午節' },
      { text: '晚上抬頭賞大圓月', emoji: '🌕', festival: 'moon', festivalName: '中秋節' },
      { text: '除夕全家吃團圓飯', emoji: '🍲', festival: 'cny', festivalName: '春節' },
      { text: '香噴噴的竹葉粽子', emoji: '🍙', festival: 'dragon', festivalName: '端午節' },
      { text: '剝香甜柚子戴柚帽', emoji: '🍐', festival: 'moon', festivalName: '中秋節' },
      { text: '門口貼紅春聯', emoji: '🏮', festival: 'cny', festivalName: '春節' },
      { text: '戴香包驅除蚊蟲', emoji: '🌿', festival: 'dragon', festivalName: '端午節' }
    ];

    /* ================= 2. 狀態管理 ================= */
    let currentMode = 'explore'; // 'explore' 或 'quiz'
    let currentFestival = 'cny';
    let isSpeechEnabled = true;
    let quizStars = 0;
    let currentQuizIndex = 0;
    let shuffledQuizList = [];

    /* ================= 3. 音效合成器 (Web Audio API) ================= */
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // 正向答對清脆音效（高雙音）
    function playSuccessSound() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        
        // 第一個高音
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'triangle';
        osc1.frequency.setValueAtTime(523.25, now); // C5
        gain1.gain.setValueAtTime(0.25, now);
        gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.2);

        // 第二個更高音 (慶祝感)
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(659.25, now + 0.15); // E5
        gain2.gain.setValueAtTime(0.25, now + 0.15);
        gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(now + 0.15);
        osc2.stop(now + 0.45);
      } catch (e) {
        console.warn('音效播放失敗:', e);
      }
    }

    // 溫和引導音效（低沉無威脅感短音，不造成挫折）
    function playTryAgainSound() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(329.63, now); // E4 溫和音
        osc.frequency.linearRampToValueAtTime(261.63, now + 0.25); // 滑向 C4
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      } catch (e) {
        console.warn('音效播放失敗:', e);
      }
    }

    /* ================= 4. 語音朗讀輔助 (Web Speech API) ================= */
    function speakText(text) {
      if (!isSpeechEnabled || !('speechSynthesis' in window)) return;

      // 停止先前正在朗讀的聲音，避免聲音重疊混亂
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-TW';
      utterance.rate = 0.85; // 特教需求：稍微放慢語速，吐字更清楚
      utterance.pitch = 1.05; // 柔和親切聲調

      // 嘗試選取繁體中文語音庫
      const voices = window.speechSynthesis.getVoices();
      const twVoice = voices.find(v => v.lang.includes('zh-TW') || v.lang.includes('TW') || v.lang.includes('cmn-Hant-TW'));
      if (twVoice) {
        utterance.voice = twVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    function toggleSpeech() {
      isSpeechEnabled = !isSpeechEnabled;
      const ttsIcon = document.getElementById('tts-icon');
      const ttsBtn = document.getElementById('btn-tts-toggle');

      if (isSpeechEnabled) {
        ttsIcon.textContent = '🔊';
        ttsBtn.classList.remove('bg-gray-200', 'border-gray-400', 'text-gray-600');
        ttsBtn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800');
        speakText('語音功能已開啟');
      } else {
        window.speechSynthesis.cancel();
        ttsIcon.textContent = '🔇';
        ttsBtn.classList.remove('bg-emerald-100', 'border-emerald-500', 'text-emerald-800');
        ttsBtn.classList.add('bg-gray-200', 'border-gray-400', 'text-gray-600');
      }
    }

    /* ================= 5. 模式切換邏輯 ================= */
    function switchMode(mode) {
      currentMode = mode;
      const btnExplore = document.getElementById('btn-mode-explore');
      const btnQuiz = document.getElementById('btn-mode-quiz');
      const secExplore = document.getElementById('section-explore');
      const secQuiz = document.getElementById('section-quiz');

      if (mode === 'explore') {
        btnExplore.className = "big-touch-btn flex items-center gap-2 px-4 py-3 rounded-2xl border-4 font-black text-lg sm:text-xl bg-orange-500 text-white border-orange-600 shadow-md";
        btnQuiz.className = "big-touch-btn flex items-center gap-2 px-4 py-3 rounded-2xl border-4 font-black text-lg sm:text-xl bg-yellow-100 text-amber-900 border-amber-400 hover:bg-yellow-200 shadow-sm";
        secExplore.classList.remove('hidden');
        secQuiz.classList.add('hidden');
        speakText('進入認識節慶模式，點選節慶卡片開始探索吧！');
      } else {
        btnQuiz.className = "big-touch-btn flex items-center gap-2 px-4 py-3 rounded-2xl border-4 font-black text-lg sm:text-xl bg-purple-600 text-white border-purple-700 shadow-md";
        btnExplore.className = "big-touch-btn flex items-center gap-2 px-4 py-3 rounded-2xl border-4 font-black text-lg sm:text-xl bg-yellow-100 text-amber-900 border-amber-400 hover:bg-yellow-200 shadow-sm";
        secExplore.classList.add('hidden');
        secQuiz.classList.remove('hidden');
        initQuizGame();
      }
    }

    /* ================= 6. 認識探索模式邏輯 ================= */
    function selectFestival(key) {
      currentFestival = key;
      const fest = FESTIVAL_DATA[key];
      if (!fest) return;

      // 更新卡片外框視覺亮顯
      ['cny', 'dragon', 'moon'].forEach(fKey => {
        const card = document.getElementById(`card-btn-${fKey}`);
        if (fKey === key) {
          card.classList.add('ring-4', 'ring-offset-2', 'ring-amber-500', 'scale-105');
        } else {
          card.classList.remove('ring-4', 'ring-offset-2', 'ring-amber-500', 'scale-105');
        }
      });

      // 更新詳細展板內容
      document.getElementById('detail-main-emoji').textContent = fest.emoji;
      document.getElementById('detail-title').textContent = `${fest.name}（${fest.badge}）`;
      document.getElementById('detail-subtitle').textContent = fest.summary;

      // 動態產生 4 個代表物件的大按鈕
      const grid = document.getElementById('items-grid');
      grid.innerHTML = '';

      fest.items.forEach(item => {
        const itemBtn = document.createElement('div');
        itemBtn.className = "big-touch-btn cursor-pointer bg-amber-50 hover:bg-amber-100 border-4 border-amber-300 hover:border-amber-500 rounded-3xl p-5 text-center shadow-md transition-all flex flex-col items-center justify-center";
        itemBtn.onclick = () => {
          playSuccessSound();
          speakText(`${item.name}。${item.desc}`);
        };

        itemBtn.innerHTML = `
          <span class="text-6xl sm:text-7xl mb-3 drop-shadow">${item.emoji}</span>
          <h4 class="text-2xl sm:text-3xl font-black text-slate-800 mb-2">${item.name}</h4>
          <p class="text-base sm:text-lg font-bold text-slate-600 line-clamp-3">${item.desc}</p>
          <div class="mt-3 inline-flex items-center gap-1 text-sm font-bold text-amber-700 bg-amber-200/80 px-3 py-1 rounded-full">
            <span>🔊 點我聽發音</span>
          </div>
        `;
        grid.appendChild(itemBtn);
      });

      // 朗讀節慶簡介
      speakText(`${fest.name}。${fest.summary}`);
    }

    function speakCurrentFestivalSummary() {
      const fest = FESTIVAL_DATA[currentFestival];
      if (fest) {
        speakText(`${fest.name}。${fest.summary}`);
      }
    }

    /* ================= 7. 節慶挑戰闖關小遊戲 ================= */
    function initQuizGame() {
      quizStars = 0;
      updateStarsUI();
      // 洗牌題目
      shuffledQuizList = [...QUIZ_BANK].sort(() => Math.random() - 0.5);
      currentQuizIndex = 0;
      document.getElementById('victory-modal').classList.add('hidden');
      loadQuizQuestion();
    }

    function loadQuizQuestion() {
      if (currentQuizIndex >= shuffledQuizList.length) {
        currentQuizIndex = 0; // 若題庫循環完畢則重置索引
      }

      const q = shuffledQuizList[currentQuizIndex];
      document.getElementById('quiz-icon').textContent = q.emoji;
      document.getElementById('quiz-text').textContent = q.text;

      // 隱藏回饋字卡
      const fbBox = document.getElementById('quiz-feedback-text');
      fbBox.className = "hidden";

      // 朗讀題目
      speakQuizQuestion();
    }

    function speakQuizQuestion() {
      const q = shuffledQuizList[currentQuizIndex];
      if (q) {
        speakText(`請問：${q.text}，是哪一個節日呢？`);
      }
    }

    function updateStarsUI() {
      const container = document.getElementById('stars-container');
      container.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        const star = document.createElement('span');
        if (i < quizStars) {
          star.textContent = '⭐';
          star.className = 'scale-110 transition-transform';
        } else {
          star.textContent = '☆';
          star.className = 'text-amber-200';
        }
        container.appendChild(star);
      }
    }

    function handleAnswer(selectedFestival) {
      const q = shuffledQuizList[currentQuizIndex];
      const fbBox = document.getElementById('quiz-feedback-text');
      const card = document.getElementById('quiz-question-card');

      if (selectedFestival === q.festival) {
        // ========== 答對了！正向回饋 ==========
        playSuccessSound();
        quizStars++;
        updateStarsUI();

        // 彩花紙屑特效
        confetti({
          particleCount: 50,
          spread: 70,
          origin: { y: 0.6 }
        });

        fbBox.className = "block bg-emerald-100 border-emerald-500 text-emerald-900 text-2xl sm:text-3xl font-black px-6 py-3 rounded-2xl shadow-md";
        fbBox.textContent = `🎉 答對了！就是【${q.festivalName}】！`;
        speakText(`太棒了！答對了！這是${q.festivalName}！`);

        // 檢查是否集滿 5 顆星星獲勝
        if (quizStars >= 5) {
          setTimeout(() => {
            showVictoryModal();
          }, 1200);
        } else {
          // 延遲後換下一題
          setTimeout(() => {
            currentQuizIndex++;
            loadQuizQuestion();
          }, 1800);
        }

      } else {
        // ========== 溫和提示（無挫折、不扣分） ==========
        playTryAgainSound();
        card.classList.add('shake-gentle');
        setTimeout(() => card.classList.remove('shake-gentle'), 500);

        fbBox.className = "block bg-amber-100 border-amber-400 text-amber-900 text-2xl sm:text-3xl font-black px-6 py-3 rounded-2xl shadow-md";
        fbBox.textContent = `💛 想想看，再試一次看看喔！`;
        speakText('沒關係，再試一次看看喔！');
      }
    }

    function showVictoryModal() {
      // 盛大的過關彩花瀑布
      confetti({
        particleCount: 120,
        spread: 100,
        origin: { y: 0.4 }
      });
      document.getElementById('victory-modal').classList.remove('hidden');
      speakText('太棒了！恭喜你集滿五顆大星星，是民俗節慶小達人！');
    }

    function restartQuiz() {
      initQuizGame();
    }

    /* ================= 8. 全螢幕模式控制 ================= */
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.warn(`全螢幕切換失敗: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    /* ================= 9. 頁面加載初始化 ================= */
    window.onload = function() {
      // 預設選取春節
      selectFestival('cny');
      
      // 預載瀏覽器語音庫
      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
          window.speechSynthesis.getVoices();
        };
      }
    };
  </script>
</body>
